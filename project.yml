name: NearNote

options:
  bundleIdPrefix: com.wayzs999
  createSharedSchemes: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

# -----------------------------------------------------------------------------
# 说明（改这个文件前先读）：
#
# 1. 本项目刻意不使用任何需要 provisioning profile 特殊授权的能力：
#    - 没有 iCloud / CloudKit
#    - 没有 App Group
#    - 没有 Push
#    - 没有 Critical Alerts
#    这样 CI 出的未签名 ipa 可以直接交给第三方签名服务重签。
#
# 2. Widget 扩展（NearNoteWidget/）暂时不参与构建。要恢复的话把它加回
#    targets 并重新引入 App Group——第三方签名服务通常签不过带 App Group 的包。
# -----------------------------------------------------------------------------

targets:
  NearNote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NearNote
    settings:
      base:
        INFOPLIST_FILE: NearNote/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wayzs999.arrival
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        # 以下运行时配置留空即可；留空时 App 自动走 Apple MapKit / 关闭遥测
        GOOGLE_PLACES_API_KEY: ""
        NEARNOTE_TELEMETRY_ENDPOINT: ""
        NEARNOTE_FEEDBACK_ENDPOINT: ""
        NEARNOTE_PRIVACY_URL: ""
        NEARNOTE_SUPPORT_URL: ""

  NearNoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NearNoteTests
    dependencies:
      - target: NearNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wayzs999.arrivalTests

schemes:
  NearNote:
    build:
      targets:
        NearNote: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - NearNoteTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
